<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discox — Sistem Bakımda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(225, 48, 108, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 1;
            position: relative;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #e1306c;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #e1306c;
            border-radius: 50%;
            box-shadow: 0 0 10px #e1306c;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }

        .description {
            font-size: 0.9rem;
            color: #a8a8a8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.85rem;
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-box a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-box a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #555;
            font-weight: 500;
            letter-spacing: 1px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="card">
        <div class="status-badge">
            <span class="status-dot"></span>
            SİSTEM GÜNCELLEMESİ
        </div>

        <div class="logo">DISCOX</div>
        <div class="title">Bakım Molasındayız</div>
        <div class="description">
            Discox platformunu sizlere daha hızlı ve kesintisiz sunabilmek için altyapı güncellemeleri yapıyoruz. Kısa süre içinde tekrar yayında olacağız!
        </div>

        <div class="contact-box">
            Destek ve İletişim:<br>
            <a href="mailto:discox3728@gmail.com">discox3728@gmail.com</a>
        </div>
    </div>

    <div class="footer">From Discox</div>

</body>
  </html>
